<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScentPlugSweden Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f5f3ef;color:#171717}.wrap{max-width:1200px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd6ce;border-radius:16px;padding:20px;margin-bottom:16px}input,select,textarea,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #ccc;box-sizing:border-box}input,select,textarea{width:100%}button{background:#111;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.tabs{display:flex;gap:8px}.hidden{display:none!important}.product{display:grid;grid-template-columns:90px 1fr;gap:15px;border:1px solid #ddd6ce;border-radius:14px;padding:14px}.product img{width:90px;height:110px;object-fit:cover;border-radius:8px}.orders,.products{display:grid;gap:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{width:auto}.error{color:#b00020}.ok{color:#176b36}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.product{grid-template-columns:1fr}.product img{width:100%;height:180px}}</style></head><body><main class="wrap"><header class="row" style="justify-content:space-between"><div><small>SCENTPLUGSWEDEN · V7</small><h1>Admin</h1></div><button id="logout" class="hidden">Logga ut</button></header><section id="login" class="card" style="max-width:420px;margin:10vh auto"><h2>Admin login</h2><form id="loginForm"><input id="password" type="password" placeholder="Lösenord" required><button style="width:100%;margin-top:10px">Logga in</button></form><p id="loginError" class="error"></p></section><section id="app" class="hidden"><div class="grid"><div class="card"><small>Ordrar</small><h2 id="statOrders">0</h2></div><div class="card"><small>Nya</small><h2 id="statNew">0</h2></div><div class="card"><small>Produkter</small><h2 id="statProducts">0</h2></div><div class="card"><small>Lågt lager</small><h2 id="statLow">0</h2></div></div><div class="tabs card"><button id="ordersTab">Ordrar</button><button id="productsTab">Produkter & lager</button><button id="refresh">Uppdatera</button></div><section id="ordersSection"><div class="card"><div class="row"><input id="search" placeholder="Sök order, namn eller e-post"><select id="filter"><option value="">Alla statusar</option><option>Mottagen</option><option>Betald</option><option>Packas</option><option>Skickad</option><option>Levererad</option><option>Avbruten</option></select></div></div><div id="orders" class="orders"></div></section><section id="productsSection" class="hidden"><div class="card"><button id="newProduct">+ Ny produkt</button><div id="formWrap" class="hidden"><form id="productForm"><input id="pId" placeholder="ID" required><input id="pName" placeholder="Produktnamn" required><input id="pBrand" placeholder="Märke" required><input id="pCategory" placeholder="Kategori" required><label style="display:block;margin:10px 0 4px"><b>Säsong</b></label><select id="pSeason"><option value="none">Ingen</option><option value="summer">☀️ Sommarparfym</option><option value="winter">❄️ Vinterparfym</option><option value="both">☀️❄️ Båda</option></select><input id="pImage" placeholder="Bild-URL" required><textarea id="pDescription" placeholder="Beskrivning" required></textarea><input id="pNotes" placeholder="Noter, separerade med komma"><label><input id="pBest" type="checkbox" style="width:auto"> Bästsäljare</label><div id="sizes"></div><div class="row"><button type="button" id="addSize">+ Storlek</button><button>Spara</button><button type="button" id="cancel">Avbryt</button></div><p id="productError" class="error"></p></form></div></div><div id="products" class="products"></div></section></section></main><script src="/admin.js?v=7"></script></body></html>
