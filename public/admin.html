<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScentPlugSweden Admin V7</title><link rel="stylesheet" href="/style.css"><style>
.admin{max-width:1250px;margin:0 auto;padding:32px 20px}.adminTop{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.panel{background:#fff;border:1px solid #ddd8d0;border-radius:18px;padding:20px;box-shadow:0 12px 35px #00000008}.login{max-width:420px;margin:12vh auto}.adminGrid{display:grid;gap:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#f4f1eb;border-radius:14px;padding:16px}.stat b{display:block;font-size:26px;margin-top:6px}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button{border:1px solid #ccc;background:#fff;border-radius:999px;padding:10px 14px;cursor:pointer}.tabs button.active{background:#111;color:#fff}.order{border:1px solid #e4dfd8;border-radius:16px;padding:18px}.orderHead{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}.orderMeta{color:#666;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}.row input,.row select,.productForm input,.productForm textarea{padding:11px 12px;border:1px solid #ccc;border-radius:10px;background:#fff}.row input{min-width:230px}.pill{padding:7px 10px;border-radius:999px;background:#f0ede8;font-size:12px}.items{margin:12px 0;padding-left:18px}.hidden{display:none!important}.error{color:#b00020;margin-top:10px}.ok{color:#176b36;margin-top:10px}.productsAdmin{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.productAdmin{border:1px solid #e4dfd8;border-radius:16px;padding:16px;display:grid;grid-template-columns:100px 1fr;gap:16px}.productAdmin img{width:100px;height:120px;object-fit:cover;border-radius:10px}.stockGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.stockGrid label{font-size:11px;color:#777}.stockGrid input{width:100%;padding:8px;border:1px solid #ccc;border-radius:8px}.productForm{display:grid;gap:10px}.productForm textarea{min-height:70px;font:inherit}.productForm .sizeLine{display:grid;grid-template-columns:1fr 100px 100px auto;gap:8px}.subhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.productsAdmin{grid-template-columns:1fr}}@media(max-width:600px){.adminTop{align-items:flex-start;flex-direction:column}.productAdmin{grid-template-columns:1fr}.productAdmin img{width:100%;height:180px}.productForm .sizeLine{grid-template-columns:1fr 1fr}.stockGrid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="admin"><div class="adminTop"><div><small>SCENTPLUGSWEDEN · V7</small><h1>Admin</h1></div><button id="logout" class="btn hidden">Logga ut</button></div><section id="loginPanel" class="panel login"><h2>Admin login</h2><p>Logga in för att hantera ordrar och produkter.</p><form id="loginForm"><input id="password" type="password" placeholder="Lösenord" required style="width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px"><button class="btn full" style="margin-top:12px">Logga in</button></form><p id="loginError" class="error"></p></section><section id="dashboard" class="hidden"><div class="stats"><div class="stat">Ordrar<b id="statOrders">0</b></div><div class="stat">Nya<b id="statNew">0</b></div><div class="stat">Produkter<b id="statProducts">0</b></div><div class="stat">Lågt lager<b id="statLow">0</b></div></div><div class="tabs"><button id="ordersTab" class="active">Ordrar</button><button id="productsTab">Produkter & lager</button></div><section id="ordersSection"><div class="panel" style="margin-bottom:16px"><div class="row"><b>Orderhantering</b><span id="count" class="pill"></span><input id="orderSearch" placeholder="Sök order, namn eller e-post"><select id="statusFilter"><option value="">Alla statusar</option><option>Betalning väntar</option><option>Mottagen</option><option>Betald</option><option>Packas</option><option>Skickad</option><option>Levererad</option><option>Avbruten</option></select><button id="refresh" class="btn">Uppdatera</button></div></div><div id="orders" class="adminGrid"></div></section><section id="productsSection" class="hidden"><div class="panel" style="margin-bottom:16px"><div class="subhead"><div><b>Produkter</b><div class="orderMeta">Lägg till, redigera priser och lager.</div></div><button id="newProduct" class="btn">+ Ny produkt</button></div><div id="productFormWrap" class="hidden"><form id="productForm" class="productForm"><input id="pId" placeholder="ID (t.ex. sauvage-intense)" required><input id="pName" placeholder="Produktnamn" required><input id="pBrand" placeholder="Märke" required><input id="pCategory" placeholder="Kategori" required><input id="pImage" placeholder="Bild-URL" required><textarea id="pDescription" placeholder="Beskrivning" required></textarea><input id="pNotes" placeholder="Noter, separerade med komma"><div id="sizeLines"></div><div class="row"><button class="btn" type="button" id="addSize">+ Storlek</button><button class="btn" type="submit">Spara produkt</button><button class="btn" type="button" id="cancelProduct">Avbryt</button></div><p id="productError" class="error"></p><p id="productOk" class="ok"></p></form></div></div><div id="productsAdmin" class="productsAdmin"></div></section></section></div><script src="/admin.js"></script></body></html>
