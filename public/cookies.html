okies',home:'Retour à la boutique',h:['Technologies nécessaires','Analyse et marketing','Contact'],p:['Le site peut utiliser des technologies nécessaires au panier, au choix de langue et au paiement. Le choix de langue est enregistré localement dans le navigateur.','Si ScentPlugSweden utilise des outils d’analyse ou de marketing nécessitant un consentement, celui-ci sera obtenu lorsque la loi l’exige.','Scentplugsweden@gmail.com']}};function render(){const lang=localStorage.getItem('splang')||'sv',l=L[lang];document.documentElement.lang=lang;title.textContent=l.title;home.textContent=l.home;content.innerHTML=l.h.map((h,i)=>`<h2>${h}</h2><p>${i===2?'<a href="mailto:Scentplugsweden@gmail.com">'+l.p[i]+'</a>':l.p[i]}</p>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('splang',b.dataset.lang);render()});render()</script></body></html>
