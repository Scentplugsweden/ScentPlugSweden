<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScentPlugSweden — Privacy</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/animations.css"></head><body><header><a class="logo" href="/">SCENT<span>PLUG</span>SWEDEN</a><div class="language"><button data-lang="sv">SV</button><button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="fr">FR</button></div></header><main class="orderPage"><section class="panel orderLookup"><h1 id="title"></h1><div id="content"></div><a class="btn full" href="/" id="home"></a></section></main><script>const L={sv:{title:'Integritetspolicy',home:'Till shoppen',h:['Personuppgifter','Betalning','Leverans','Kontakt','Lagring och rättigheter'],p:['ScentPlugSweden behandlar personuppgifter som behövs för beställningar, betalningar, leveranser, kundservice och lagstadgade skyldigheter. Uppgifter kan omfatta namn, e-post, adress, postnummer, ort och telefonnummer.','Betalningar hanteras via Stripe. ScentPlugSweden ska inte lagra fullständiga kortuppgifter.','Leveransinformation används för att fullfölja ordern via valt leveranssätt, för närvarande PostNord.','För frågor om personuppgifter eller dina rättigheter: Scentplugsweden@gmail.com.','Personuppgifter ska inte sparas längre än vad som behövs eller krävs enligt lag. Rätt till tillgång, rättelse, radering eller begränsning kan gälla beroende på omständigheterna.']},en:{title:'Privacy policy',home:'Back to shop',h:['Personal data','Payment','Delivery','Contact','Storage and rights'],p:['ScentPlugSweden processes personal data needed for orders, payments, delivery, customer service and legal obligations. This may include name, email, address, postal code, city and phone number.','Payments are handled by Stripe. ScentPlugSweden should not store full card details.','Delivery information is used to fulfil orders through the selected delivery method, currently PostNord.','For questions about personal data or your rights: Scentplugsweden@gmail.com.','Personal data should not be kept longer than necessary or required by law. Rights to access, correction, deletion or restriction may apply depending on the circumstances.']},de:{title:'Datenschutzerklärung',home:'Zum Shop',h:['Personenbezogene Daten','Zahlung','Lieferung','Kontakt','Speicherung und Rechte'],p:['ScentPlugSweden verarbeitet personenbezogene Daten, die für Bestellungen, Zahlungen, Lieferung, Kundenservice und gesetzliche Pflichten erforderlich sind.','Zahlungen werden über Stripe abgewickelt. ScentPlugSweden sollte keine vollständigen Kartendaten speichern.','Lieferdaten werden zur Erfüllung der Bestellung über die gewählte Versandart, derzeit PostNord, verwendet.','Bei Fragen zu personenbezogenen Daten oder Ihren Rechten: Scentplugsweden@gmail.com.','Daten sollten nicht länger gespeichert werden als erforderlich oder gesetzlich vorgeschrieben. Je nach Umständen können Rechte auf Auskunft, Berichtigung, Löschung oder Einschränkung bestehen.']},fr:{title:'Politique de confidentialité',home:'Retour à la boutique',h:['Données personnelles','Paiement','Livraison','Contact','Conservation et droits'],p:['ScentPlugSweden traite les données personnelles nécessaires aux commandes, paiements, livraisons, service client et obligations légales.','Les paiements sont traités par Stripe. ScentPlugSweden ne devrait pas conserver les données complètes des cartes.','Les informations de livraison servent à exécuter la commande via le mode choisi, actuellement PostNord.','Pour toute question sur les données personnelles ou vos droits : Scentplugsweden@gmail.com.','Les données ne doivent pas être conservées plus longtemps que nécessaire ou exigé par la loi. Selon les circonstances, des droits d’accès, de rectification, d’effacement ou de limitation peuvent s’appliquer.']}};function render(){const lang=localStorage.getItem('splang')||'sv',l=L[lang];document.documentElement.lang=lang;title.textContent=l.title;home.textContent=l.home;content.innerHTML=l.h.map((h,i)=>`<h2>${h}</h2><p>${i===3?'<a href="mailto:Scentplugsweden@gmail.com">'+l.p[i]+'</a>':l.p[i]}</p>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('splang',b.dataset.lang);render()});render()</script></body></html>
