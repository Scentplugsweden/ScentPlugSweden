<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ScentPlugSweden — Terms</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/animations.css"></head><body><header><a class="logo" href="/">SCENT<span>PLUG</span>SWEDEN</a><div class="language"><button data-lang="sv">SV</button><button data-lang="en">EN</button><button data-lang="de">DE</button><button data-lang="fr">FR</button></div></header><main class="orderPage"><section class="panel orderLookup"><h1 id="title"></h1><div id="content"></div><a class="btn full" href="/" id="home"></a></section></main><script>const L={sv:{title:'Köpvillkor',home:'Till shoppen',h:['Beställning och betalning','Leverans','Ångerrätt','Reklamation','Kontakt'],p:['Priser visas i svenska kronor. Betalningen slutförs via Stripe. En order behandlas efter genomförd betalning enligt butikens orderflöde.','Standardfrakt är 49 kr och fri frakt gäller över 399 kr. Leveransalternativet är PostNord. Angivna leveranstider är uppskattningar och kan påverkas av transportören.','För konsumentköp gäller lagstadgade regler om ångerrätt när de är tillämpliga. ScentPlugSweden anger 14 dagars ångerrätt för köp där ångerrätten gäller. Undantag kan förekomma enligt tillämplig lag.','Om en vara är felaktig ska kunden kontakta ScentPlugSweden så snart som möjligt med orderuppgifter och en beskrivning av problemet.','Scentplugsweden@gmail.com']},en:{title:'Terms & conditions',home:'Back to shop',h:['Orders and payment','Delivery','Right of withdrawal','Complaints','Contact'],p:['Prices are shown in Swedish kronor. Payments are completed through Stripe. Orders are processed after successful payment.','Standard shipping is 49 SEK and free shipping applies over 399 SEK. Delivery is handled through PostNord. Delivery times are estimates and may be affected by the carrier.','For consumer purchases, statutory withdrawal rights apply where applicable. ScentPlugSweden states a 14-day withdrawal period where the right applies. Exceptions may apply under applicable law.','If an item is defective, contact ScentPlugSweden as soon as possible with your order details and a description of the issue.','Scentplugsweden@gmail.com']},de:{title:'Kaufbedingungen',home:'Zum Shop',h:['Bestellung und Zahlung','Lieferung','Widerrufsrecht','Reklamationen','Kontakt'],p:['Preise werden in schwedischen Kronen angezeigt. Zahlungen werden über Stripe abgeschlossen. Bestellungen werden nach erfolgreicher Zahlung bearbeitet.','Der Standardversand kostet 49 SEK, ab 399 SEK ist der Versand kostenlos. Der Versand erfolgt mit PostNord. Lieferzeiten sind Schätzungen und können vom Versanddienstleister beeinflusst werden.','Für Verbraucherkäufe gelten die gesetzlichen Widerrufsrechte, soweit anwendbar. ScentPlugSweden gewährt 14 Tage Widerrufsrecht, soweit dieses gilt. Gesetzliche Ausnahmen können bestehen.','Bei einem fehlerhaften Artikel kontaktieren Sie ScentPlugSweden möglichst schnell mit Bestelldaten und einer Beschreibung des Problems.','Scentplugsweden@gmail.com']},fr:{title:'Conditions de vente',home:'Retour à la boutique',h:['Commande et paiement','Livraison','Droit de rétractation','Réclamation','Contact'],p:['Les prix sont indiqués en couronnes suédoises. Les paiements sont effectués via Stripe. Les commandes sont traitées après paiement réussi.','La livraison standard coûte 49 SEK et est gratuite au-delà de 399 SEK. La livraison est effectuée avec PostNord. Les délais sont indicatifs et peuvent dépendre du transporteur.','Pour les achats des consommateurs, le droit légal de rétractation s’applique lorsqu’il est applicable. ScentPlugSweden indique un délai de 14 jours lorsque ce droit s’applique. Des exceptions légales peuvent exister.','Si un article est défectueux, contactez ScentPlugSweden dès que possible avec les informations de commande et une description du problème.','Scentplugsweden@gmail.com']}};function render(){const l=L[localStorage.getItem('splang')||'sv'];document.documentElement.lang=localStorage.getItem('splang')||'sv';title.textContent=l.title;home.textContent=l.home;content.innerHTML=l.h.map((h,i)=>`<h2>${h}</h2><p>${i===4?'<a href="mailto:Scentplugsweden@gmail.com">'+l.p[i]+'</a>':l.p[i]}</p>`).join('');document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===document.documentElement.lang))}document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{localStorage.setItem('splang',b.dataset.lang);render()});render()</script></body></html>
