<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spåra order — ScentPlugSweden</title><link rel="stylesheet" href="/style.css"></head><body><header><a class="logo" href="/">SCENT<span>PLUG</span>SWEDEN</a><a class="btn" href="/">Till shoppen</a></header><main class="orderPage"><section class="panel orderLookup"><small>SCENTPLUGSWEDEN</small><h1>Spåra din order</h1><p>Fyll i ordernumret och samma e-postadress som användes vid beställningen.</p><form id="trackForm"><input id="orderId" placeholder="Ordernummer, t.ex. SP-AB12CD34" required><input id="orderEmail" type="email" placeholder="E-postadress" required><button class="btn full">Visa orderstatus</button></form><p id="trackError" class="error"></p><div id="result" class="hidden"></div></section></main><script>
const $=s=>document.querySelector(s);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function render(o){const steps=['Mottagen','Betald','Packas','Skickad','Levererad'];const current=steps.indexOf(o.status);const tracking=o.trackingNumber?`<div class="tracking"><b>Trackingnummer</b><span>${esc(o.trackingNumber)}</span><a class="btn" target="_blank" rel="noopener" href="https://www.postnord.se/verktyg/sok-forsandelse">Spåra hos PostNord</a></div>`:'';$('#result').innerHTML=`<div class="orderResult"><div class="orderResultHead"><div><small>ORDER</small><h2>${esc(o.id)}</h2></div><span class="pill">${esc(o.status)}</span></div><div class="statusSteps">${steps.map((s,i)=>`<div class="statusStep ${i<=current?'done':''}"><b>${i+1}</b><span>${s}</span></div>`).join('')}</div><ul>${o.items.map(i=>`<li>${esc(i.name)} — ${esc(i.size)} × ${i.qty}</li>`).join('')}</ul><div class="orderTotals"><span>Varor</span><b>${o.subtotal} kr</b><span>Frakt</span><b>${o.shippingCost===0?'Fri':o.shippingCost+' kr'}</b><span>Totalt</span><b>${o.total} kr</b></div>${tracking}</div>`;$('#result').classList.remove('hidden')}
const params=new URLSearchParams(location.search);if(params.get('id')&&params.get('email')){$('#orderId').value=params.get('id');$('#orderEmail').value=params.get('email');setTimeout(()=>$('#trackForm').requestSubmit(),100)}
$('#trackForm').onsubmit=async e=>{e.preventDefault();$('#trackError').textContent='';const id=$('#orderId').value.trim(),email=$('#orderEmail').value.trim();const r=await fetch(`/api/orders/${encodeURIComponent(id)}?email=${encodeURIComponent(email)}`);const d=await r.json().catch(()=>({}));if(!r.ok){$('#result').classList.add('hidden');$('#trackError').textContent=d.error||'Kunde inte hitta ordern.';return}render(d)};
</script></body></html>
