name: Validate storefront
on:
  pull_request:
    branches: [main]
  push:
    branches: [improvements/stability-storefront-admin]
jobs:
  syntax-and-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript and product JSON
        run: npm run check
